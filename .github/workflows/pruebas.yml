# Integración continua: corre las pruebas del backend y revisa la sintaxis
# del frontend en cada push y en cada pull request.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Correr las pruebas
        run: python -m pytest

  frontend:
    name: Frontend (sintaxis JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Revisar la sintaxis de cada archivo
        run: for archivo in frontend/js/*.js; do node --check "$archivo" || exit 1; done
