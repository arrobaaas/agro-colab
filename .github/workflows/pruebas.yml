# Integración continua: corre las pruebas del backend y revisa la sintaxis
# del frontend en cada push y en cada pull request.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest con SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Correr las pruebas
        run: python -m pytest

  backend-postgresql:
    name: Backend (pytest con PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agrocolab
          POSTGRES_PASSWORD: agrocolab
          POSTGRES_DB: agrocolab_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrocolab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PRUEBAS_DB_URL: postgresql://agrocolab:agrocolab@localhost:5432/agrocolab_pruebas
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Correr las pruebas
        run: python -m pytest

  frontend:
    name: Frontend (sintaxis JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Revisar la sintaxis de cada archivo
        run: for archivo in frontend/js/*.js; do node --check "$archivo" || exit 1; done
